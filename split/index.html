<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分帳小幫手</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1d2433;--mu:#6b7488;--pri:#3b6cf6;--ok:#17a673;--bad:#e5484d;--bd:#e3e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f2b;--tx:#e8ecf5;--mu:#8e98ad;--bd:#2b3242}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],select{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
button{border:0;border-radius:9px;padding:9px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button.x{background:transparent;color:var(--mu);padding:2px 8px;font-size:18px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:3px 4px 3px 12px}
label.f{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--bd);border-radius:99px;cursor:pointer;background:var(--bg)}
.checks input{accent-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item small{color:var(--mu);display:block}
.amt{font-weight:600;white-space:nowrap}
.pay{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;background:var(--bg);margin-bottom:8px}
.pay b{color:var(--pri);font-size:18px}
.bal{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.mu{color:var(--mu);font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>💸 分帳小幫手</h1>

<section>
  <h2>1. 成員</h2>
  <div class="row"><input type="text" id="pname" placeholder="輸入名字後按 Enter 或「新增」" maxlength="20"><button id="addP">新增</button></div>
  <div class="chips" id="people"></div>
</section>

<section>
  <h2>2. 新增一筆支出</h2>
  <label class="f" style="margin-top:0">項目</label>
  <input type="text" id="title" placeholder="例如：晚餐" maxlength="40">
  <div class="grid">
    <div><label class="f">金額</label><input type="number" id="amount" inputmode="decimal" min="0" step="any" placeholder="0"></div>
    <div><label class="f">誰付的錢</label><select id="payer"></select></div>
  </div>
  <label class="f">哪些人要分（均分）</label>
  <div class="checks" id="shares"></div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" id="allBtn" type="button">全選</button>
    <button class="ghost" id="noneBtn" type="button">全不選</button>
  </div>
  <div class="err" id="err"></div>
  <button id="addE" style="width:100%">加入這筆支出</button>
</section>

<section>
  <h2>3. 支出紀錄</h2>
  <div id="list"></div>
</section>

<section>
  <h2>4. 結算</h2>
  <div id="result"></div>
  <button class="ghost" id="reset" style="margin-top:12px">全部清空</button>
</section>
</main>

<script>
const KEY='split-v1';
let S={people:[],exp:[]}; // exp: {id,title,amount,payer,shares:[names]}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.people&&d.exp)S=d}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const money=n=>Number.isInteger(n)?n.toLocaleString('zh-TW'):n.toLocaleString('zh-TW',{maximumFractionDigits:2});

function addPerson(){
  const n=$('pname').value.trim();
  if(!n)return;
  if(S.people.includes(n)){$('pname').select();return}
  S.people.push(n);$('pname').value='';save();render();$('pname').focus();
}
function delPerson(n){
  const used=S.exp.some(e=>e.payer===n||e.shares.includes(n));
  if(used&&!confirm(`「${n}」已有支出紀錄，刪除後相關支出會一併移除或調整，確定嗎？`))return;
  S.people=S.people.filter(p=>p!==n);
  S.exp=S.exp.filter(e=>e.payer!==n).map(e=>({...e,shares:e.shares.filter(p=>p!==n)})).filter(e=>e.shares.length);
  save();render();
}
function addExpense(){
  const title=$('title').value.trim()||'支出';
  const amount=parseFloat($('amount').value);
  const payer=$('payer').value;
  const shares=[...document.querySelectorAll('#shares input:checked')].map(i=>i.value);
  const err=m=>{$('err').textContent=m};
  if(S.people.length<2)return err('請先新增至少 2 位成員');
  if(!(amount>0))return err('請輸入大於 0 的金額');
  if(!payer)return err('請選擇付款人');
  if(!shares.length)return err('請至少勾選一位要分攤的人');
  err('');
  S.exp.push({id:Date.now()+Math.random(),title,amount,payer,shares});
  $('title').value='';$('amount').value='';
  save();render();
}
function delExpense(id){S.exp=S.exp.filter(e=>e.id!==id);save();render()}

// 計算每人淨額（正=應收，負=應付），再四捨五入成整數並保持總和為 0
function balances(){
  const b=Object.fromEntries(S.people.map(p=>[p,0]));
  for(const e of S.exp){
    const each=e.amount/e.shares.length;
    b[e.payer]+=e.amount;
    for(const p of e.shares)b[p]-=each;
  }
  const r={};let sum=0;
  for(const p of S.people){r[p]=Math.round(b[p]);sum+=r[p]}
  // 四捨五入造成的差額（通常 ±1）由淨額絕對值最大者吸收
  if(sum!==0){
    const p=[...S.people].sort((a,c)=>Math.abs(b[c])-Math.abs(b[a]))[0];
    r[p]-=sum;
  }
  return r;
}
// 貪婪配對：最大債務人付給最大債權人，交易筆數最少
function settle(b){
  const cr=[],db=[];
  for(const p in b){if(b[p]>0)cr.push([p,b[p]]);else if(b[p]<0)db.push([p,-b[p]])}
  const out=[];
  while(cr.length&&db.length){
    cr.sort((a,c)=>c[1]-a[1]);db.sort((a,c)=>c[1]-a[1]);
    const c=cr[0],d=db[0],m=Math.min(c[1],d[1]);
    out.push({from:d[0],to:c[0],amt:m});
    c[1]-=m;d[1]-=m;
    if(c[1]===0)cr.shift();
    if(d[1]===0)db.shift();
  }
  return out;
}

function render(){
  // 成員
  $('people').innerHTML=S.people.length?S.people.map(p=>`<span class="chip">${esc(p)}<button class="x" data-del="${esc(p)}" title="刪除">×</button></span>`).join(''):'<span class="mu">尚未新增成員</span>';
  // 付款人 & 分攤
  const cur=$('payer').value;
  $('payer').innerHTML=S.people.map(p=>`<option>${esc(p)}</option>`).join('');
  if(S.people.includes(cur))$('payer').value=cur;
  const checked=new Set([...document.querySelectorAll('#shares input:checked')].map(i=>i.value));
  const known=new Set([...document.querySelectorAll('#shares input')].map(i=>i.value));
  $('shares').innerHTML=S.people.map(p=>`<label><input type="checkbox" value="${esc(p)}" ${!known.has(p)||checked.has(p)?'checked':''}>${esc(p)}</label>`).join('')||'<span class="mu">請先新增成員</span>';
  // 支出列表
  $('list').innerHTML=S.exp.length?S.exp.map(e=>`<div class="item"><div><b>${esc(e.title)}</b><small>${esc(e.payer)} 付 · ${e.shares.length===S.people.length?'全員分':esc(e.shares.join('、'))}分（每人 ${money(Math.round(e.amount/e.shares.length*100)/100)}）</small></div><div class="row"><span class="amt">${money(e.amount)}</span><button class="x" data-delx="${e.id}" title="刪除">×</button></div></div>`).join(''):'<span class="mu">還沒有支出</span>';
  // 結算
  if(!S.exp.length){$('result').innerHTML='<span class="mu">新增支出後會在這裡顯示誰要付誰多少錢</span>';return}
  const b=balances(),pays=settle(b);
  const total=S.exp.reduce((s,e)=>s+e.amount,0);
  let h=`<p class="mu" style="margin-top:0">總支出 ${money(total)}，給付金額已四捨五入為整數</p>`;
  h+=pays.length?pays.map(x=>`<div class="pay"><span><b style="color:inherit">${esc(x.from)}</b> → <b style="color:inherit">${esc(x.to)}</b></span><b>${fmt(x.amt)}</b></div>`).join(''):'<div class="pay">大家已經打平，不用轉帳 🎉</div>';
  h+='<h2 style="margin-top:18px;font-size:15px">每人淨額</h2>'+S.people.map(p=>`<div class="bal"><span>${esc(p)}</span><span class="${b[p]>0?'pos':b[p]<0?'neg':''}">${b[p]>0?'應收 ':b[p]<0?'應付 ':''}${fmt(Math.abs(b[p]))}</span></div>`).join('');
  $('result').innerHTML=h;
}

$('addP').onclick=addPerson;
$('pname').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addPerson()}};
$('addE').onclick=addExpense;
$('amount').onkeydown=$('title').onkeydown=e=>{if(e.key==='Enter')addExpense()};
$('allBtn').onclick=()=>document.querySelectorAll('#shares input').forEach(i=>i.checked=true);
$('noneBtn').onclick=()=>document.querySelectorAll('#shares input').forEach(i=>i.checked=false);
$('people').onclick=e=>{const n=e.target.dataset.del;if(n)delPerson(n)};
$('list').onclick=e=>{const id=e.target.dataset.delx;if(id)delExpense(parseFloat(id))};
$('reset').onclick=()=>{if(confirm('確定清空所有成員與支出？')){S={people:[],exp:[]};save();render()}};
render();
</script>
</body>
</html>
